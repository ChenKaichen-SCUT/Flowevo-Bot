[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowevo-recovery"
version = "0.1.0"
description = "Public-signal recovery controller and sealed small-budget pilot"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "requests>=2.31,<3", "math-verify==0.8.0", "sympy==1.14.0"]

[tool.setuptools.packages.find]
where = ["src"]
