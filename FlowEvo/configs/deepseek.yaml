llm:
  # FlowEvo calls all OpenAI-compatible endpoints through this provider.
  provider: openrouter
  base_url: https://api.deepseek.com
  model: deepseek-flash
  # Read at runtime from OPENROUTER_API_KEY; do not store credentials here.
  api_key: ""
  app_name: flowevo-deepseek
  skill_top_k: 3
  skill_context_budgets:
    draft_total_tokens: 4096
    repair_total_tokens: 4096
    draft_per_skill_tokens: 1500
    repair_per_skill_tokens: 1500
  draft:
    temperature: 0.2
    max_output_tokens: 2048
  repair:
    temperature: 0.15
    max_output_tokens: 2048
