[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowevo-bot"
version = "0.3.0"
description = "Subject-organized mathematical strategy bank with gold-blind cost-aware reuse"
license-files = ["NOTICE.md", "licenses/*"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
native = ["datasets>=2.19"]
experiment = ["math-verify==0.8.0"]
rmmd = ["sympy==1.14.0", "latex2sympy2_extended==1.10.2"]

[project.scripts]
flowevo-bot = "flowevo_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
